repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        # paper/ holds the manuscript and the assets it builds from -- a 14 MB
        # PDF and print-resolution figures -- so the whole directory is exempt.
        exclude: '^paper/'
      - id: end-of-file-fixer
        exclude: '^paper/'
      - id: trailing-whitespace
        exclude: '^paper/'
      - id: check-merge-conflict
