# Top-level composition.
#
#   python scripts/train.py -m +experiment=log_penalty
#   python scripts/train.py +experiment=log_penalty +model=profile +data=vdp
#
# Every experiment sweeps `model` and `data`, so neither is a default here.

defaults:
  - config_schema      # ExperimentConfig, registered in scripts/train.py
                       # `eval` is absent: each conf/data/<name>.yaml selects its own.
  - _self_

name: run

hydra:
  job:
    # Keep relative output paths rooted at the repo; DATA_DIR is CWD-independent.
    chdir: false
  sweep:
    # Only the sweep root is shared; each conf/experiment/<name>.yaml sets its own
    # `subdir`, so the record layout is per experiment.
    dir: rawdata/logs/multirun
