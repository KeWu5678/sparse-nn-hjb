# @package _global_
# pendulum/moment_penalty: first-pass screen on the existing two-sided
# switching-band data.  Open-loop data are not regenerated.  The Make target
# separates the beta=0 baseline from the positive-beta Cartesian sweep.
defaults:
  - override /model: log_penalty
  - override /data: pendulum

name: pendulum_moment_penalty

model:
  kind: signed
  insertion: profile
  activation: tanh
  power: 1.0
  alpha: 1e-5
  gamma: 1.0
  th: 0.5
  loss_weights: [1.0, 1.0]
  moment_beta: 1e-5
  moment_order: 2.01

data:
  normalize: true
